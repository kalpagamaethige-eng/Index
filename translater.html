<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalpa AI English Translator & Teacher</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px;
            background: var(--bg-primary);
            color: var(--text-primary);
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .header-box {
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 5px 0;
            font-size: 20px;
        }

        .creator-tag {
            color: var(--accent-hover);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 3px;
            display: block;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 11px;
            margin: 0;
        }

        .container {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
        }

        button#translate {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 14px;
            transition: all 0.2s;
        }

        button#translate:active {
            transform: scale(0.98);
        }

        #output {
            margin-top: 15px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 10px;
            line-height: 1.8;
            font-size: 13.5px;
            color: #e2e8f0;
            flex: 1;
            overflow-y: auto;
            max-height: 50vh;
        }

        /* 🌟 ප්‍රධාන මාතෘකා අතර කියවීමට පහසු වන සේ Spacing ඇතුළත් කිරීම */
        .heading-highlight {
            display: block;
            background: linear-gradient(90deg, #1e293b, #0f172a);
            color: var(--accent-color);
            padding: 9px 13px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-hover);
            margin-top: 24px;   /* මාතෘකාවට ඉහළින් පැහැදිලි ඉඩක් */
            margin-bottom: 12px; /* මාතෘකාවට පහළින් ඉඩක් */
            font-weight: bold;
            font-size: 14px;
        }

        .heading-highlight:first-child {
            margin-top: 4px;
        }

        /* 🌟 පරිවර්තනය සහ Speaker වැඩකරන Modern Tab Card එක */
        .main-translation-box {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #38bdf8;
            border-left: 5px solid #0ea5e9;
            color: #ffffff;
            padding: 14px 16px;
            border-radius: 12px;
            margin: 12px 0 20px 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .translation-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .lang-line {
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.4;
            color: #f8fafc;
        }

        .lang-line.sinhala {
            color: #38bdf8;
            font-size: 14px;
        }

        .speak-btn {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            width: 44px;
            height: 44px;
            font-size: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
            transition: all 0.2s ease;
        }

        .speak-btn:hover {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(56, 189, 248, 0.4);
        }

        .speak-btn:active {
            transform: scale(0.95);
        }

        .loading {
            color: var(--accent-color);
            font-style: italic;
            text-align: center;
            margin-top: 20px;
        }

        .error-box {
            background: #450a0a;
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 14px;
            border-radius: 8px;
            font-size: 12.5px;
            white-space: pre-wrap;
            line-height: 1.6;
            word-break: break-word;
        }

        .countdown-text {
            color: #facc15;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            margin-top: 8px;
            background: #291805;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #eab308;
        }
    </style>
</head>
<body>
    <div class="header-box">
        <span class="creator-tag">Created by Kalpa Gamaethige</span>
        <h1>KALPA AI English Translator & Teacher</h1>
        <p class="subtitle">ද්විභාෂා පරිවර්තනය, ව්‍යාකරණ නිවැරදි කිරීම සහ ඉගෙනුම් සහකරු</p>
    </div>

    <div class="container">
        <textarea id="input" placeholder="මෙතැනට ඔබේ වාක්‍යය හෝ ප්‍රශ්නය ලියන්න (උදා: I goes to school yesterday)..."></textarea>
        <button id="translate">Translate (පරිවර්තනය කරන්න)</button>
        <div id="output">පිළිතුර මෙහි දිස් වනු ඇත...</div>
    </div>

    <script>
        // 🔑 401 Error එක වැළැක්වීමට 4 වන Key එක නිවැරදි කළ Base64 Keys 5
        const ENCODED_KEYS = [
            "QVEuQWI4Uk42S3VlcXNDajZ6cEFMM1BjNVVCT0xPWG9TM1FHclg1d3JlNDdOYWdyVjBqVFE",
            "QVEuQWI4Uk42TFVEeG1kNG5KZ3lvSkxzX1IzbmJxRVAxZm1VaGNQdkpyZ3NoUWFSSTFtRXc",
            "QVEuQWI4Uk42SVAxaXhhLTVhTTNSaGFjU2Z1YkI3YWtadmRqcXBuaVZWc2RRaEJqbGZIYXc",
            "QVEuQWI4Uk42SS04b1FzZ000M095QWNIVjBYSzVTYTdFNHVyYkt1bFRXSUU4Z2VrMVNsVUE",
            "QVEuQWI4Uk42S0QtbDI3MlhWcGtDYWExeXl5VlVBdHJlOE03ZzJtbE1CUWZDXzFhajFnV2c"
        ];

        let currentKeyIndex = 0;
        let countdownTimer = null;

        function getActiveApiKey() {
            try {
                const encodedKey = ENCODED_KEYS[currentKeyIndex];
                if (!encodedKey || encodedKey.includes("YOUR_")) return "";
                return atob(encodedKey.trim());
            } catch (e) {
                console.error("Error decoding API Key:", e);
                return "";
            }
        }

        function rotateApiKey() {
            if (ENCODED_KEYS.length > 1) {
                currentKeyIndex = (currentKeyIndex + 1) % ENCODED_KEYS.length;
            }
        }

        const systemPrompt = `You are an expert bilingual English-Sinhala AI teacher and translator.
Your responsibilities:
1. Translate English ↔ Sinhala accurately.
2. Correct grammar mistakes and awkward phrasing in the user's input.
3. Provide a clear Main Translation highlighted in both English and Sinhala format: [EN_TEXT] || [SI_TEXT].
4. Break down sentence structure clearly (Identify: Subject / උක්තය, Verb / ක්‍රියාපදය, Object / කර්මය, Modifiers/Other / වෙනත් කොටස්).
5. If the input is a question, answer the underlying query clearly with key information and explanatory points in Sinhala.
6. Provide multiple alternative meanings or contexts if a single word or phrase has multiple senses.
7. Provide similar sentences, patterns, or vocabulary examples to enrich learning.
8. Encourage practice with a clear follow-up question.

Format your responses neatly with clear headings:
### 🇱🇰 ප්‍රධාන පරිවර්තනය (Main Translation)
[EN_TEXT] || [SI_TEXT]

### ✍️ නිවැරදි කළ වාක්‍යය (Corrected Sentence)
### 🧩 වාක්‍ය ව්‍යුහය විශ්ලේෂණය (Sentence Breakdown)
- **උක්ත පදය (Subject)**: ...
- **ක්‍රියා පදය (Verb)**: ...
- **කර්ම පදය (Object)**: ...
- **අනෙකුත් කොටස් (Modifiers/Other)**: ...

### 📖 ව්‍යාකරණ පැහැදිලි කිරීම සහ පිළිතුර (Grammar & Answer Details)
### 📚 බහු-අර්ථ සහ වෙනත් භාවිතයන් (Multiple Meanings & Uses)
### 💡 සමාන වාක්‍ය සහ උදාහරණ (Similar Sentences & Examples)
### 💬 අභ්‍යාස ප්‍රශ්නය (Practice Question)`;

        function startCountdown(seconds, errorMessage) {
            const outputDiv = document.getElementById("output");
            let remaining = seconds;

            if (countdownTimer) clearInterval(countdownTimer);

            function updateDisplay() {
                outputDiv.innerHTML = `
                    <div class="error-box">
                        ⚠️ <strong>දෝෂයක් සිදුවී ඇත (Error Display):</strong>\n
                        ${errorMessage}\n\n
                        ⏳ <strong>නැවත සක්‍රිය වන වේලාව (Countdown):</strong><br>
                        <span class="countdown-text">තත්පර ${remaining} කින් නැවත උත්සාහ කරන්න...</span>
                    </div>`;
            }

            updateDisplay();

            countdownTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    outputDiv.innerHTML = `<div class="loading" style="color: #4ade80;">✅ API එක නැවත සක්‍රිය විය! කරුණාකර 'Translate & Learn' මත නැවත Click කරන්න.</div>`;
                } else {
                    updateDisplay();
                }
            }, 1000);
        }

        async function askGemini(promptText) {
            let attempts = 0;
            const validKeys = ENCODED_KEYS.filter(k => k && !k.includes("YOUR_"));
            const maxAttempts = (validKeys.length || 1) * 2;
            let collectedErrors = [];

            while (attempts < maxAttempts) {
                const currentApiKey = getActiveApiKey();

                if (!currentApiKey) {
                    collectedErrors.push(`Key Index [${currentKeyIndex + 1}]: Invalid or empty API key format.`);
                    rotateApiKey();
                    attempts++;
                    continue;
                }

                // 🌟 ඔබ ලබාදුන් සාර්ථක Endpoint එක: gemini-3.6-flash
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${currentApiKey}`;

                const payload = {
                    contents: [{
                        role: "user",
                        parts: [{ text: promptText }]
                    }],
                    systemInstruction: {
                        parts: [{ text: systemPrompt }]
                    }
                };

                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (response.status === 429 || response.status === 403) {
                        const rateMsg = data.error?.message || "Rate limit exceeded";
                        collectedErrors.push(`Key [${currentKeyIndex + 1}] (Status ${response.status}): ${rateMsg}`);
                        rotateApiKey();
                        attempts++;
                        await new Promise(res => setTimeout(res, 2000));
                        continue;
                    }

                    if (!response.ok) {
                        const errDetails = data.error?.message || 'Request failed';
                        collectedErrors.push(`Key [${currentKeyIndex + 1}] (Status ${response.status}): ${errDetails}`);
                        rotateApiKey();
                        attempts++;
                        continue;
                    }

                    if (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                        return { text: data.candidates[0].content.parts[0].text, error: null };
                    } else {
                        collectedErrors.push(`Key [${currentKeyIndex + 1}]: Invalid response structure.`);
                        rotateApiKey();
                        attempts++;
                    }

                } catch (error) {
                    collectedErrors.push(`Key [${currentKeyIndex + 1}]: Network Error (${error.message})`);
                    rotateApiKey();
                    attempts++;
                }
            }

            return { text: null, error: collectedErrors.join('\n') };
        }

        // 🔊 Text-To-Speech Function
        function speakBilingual(enText, siText) {
            if (!('speechSynthesis' in window)) {
                alert("ඔබගේ Browser එකෙහි Voice/Speech පහසුකම සහය නොදක්වයි.");
                return;
            }

            window.speechSynthesis.cancel();

            if (enText) {
                const enUtterance = new SpeechSynthesisUtterance(enText);
                enUtterance.lang = 'en-US';
                enUtterance.rate = 0.9;
                
                enUtterance.onend = () => {
                    if (siText) {
                        const siUtterance = new SpeechSynthesisUtterance(siText);
                        siUtterance.lang = 'si-LK';
                        siUtterance.rate = 0.95;
                        window.speechSynthesis.speak(siUtterance);
                    }
                };

                window.speechSynthesis.speak(enUtterance);
            } else if (siText) {
                const siUtterance = new SpeechSynthesisUtterance(siText);
                siUtterance.lang = 'si-LK';
                siUtterance.rate = 0.95;
                window.speechSynthesis.speak(siUtterance);
            }
        }

        // 🧹 Formatter Function
        function formatMarkdown(text) {
            if (!text) return "";

            let formatted = text;

            formatted = formatted.replace(/^---$/gim, '');

            formatted = formatted.replace(/^(.*?)\s*\|\|\s*(.*?)$/gim, (match, enText, siText) => {
                let cleanEn = enText.replace(/\*\*/g, '').trim();
                let cleanSi = siText.replace(/\*\*/g, '').trim();
                if (!cleanEn && !cleanSi) return "";
                
                let safeEn = cleanEn.replace(/'/g, "\\'");
                let safeSi = cleanSi.replace(/'/g, "\\'");

                return `<div class="main-translation-box">
                    <div class="translation-content">
                        <div class="lang-line english">🇬🇧 ${cleanEn}</div>
                        <div class="lang-line sinhala">🇱🇰 ${cleanSi}</div>
                    </div>
                    <button class="speak-btn" onclick="speakBilingual('${safeEn}', '${safeSi}')" title="ශ්‍රවණය කරන්න">🔊</button>
                </div>`;
            });

            formatted = formatted.replace(/(?:###|##)\s*(.*$)/gim, (match, title) => {
                let cleanTitle = title.replace(/\*\*/g, '').trim(); 
                if (!cleanTitle) return "";
                return `<span class="heading-highlight">${cleanTitle}</span>`;
            });

            formatted = formatted.replace(/^(?:-|\*|\d+\.)?\s*\*\*(.*?)\*\*:\s*/gim, (match, title) => {
                return `<span class="heading-highlight">${title.trim()}</span>`;
            });

            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');

            formatted = formatted.replace(/^\s*[\.\*•-]\s*$/gim, '');
            formatted = formatted.replace(/^\s*[\*•-]\s+/gim, '• ');

            formatted = formatted.split('\n')
                .map(line => line.trim())
                .filter(line => line.length > 0)
                .join('<br>');

            formatted = formatted.replace(/<\/span><br>/g, '</span>');

            return formatted;
        }

        document.getElementById("translate").onclick = async () => {
            const inputField = document.getElementById("input");
            const outputDiv = document.getElementById("output");
            const translateBtn = document.getElementById("translate");
            const text = inputField.value.trim();

            if (!text) {
                outputDiv.innerText = "කරුණාකර යම් වාක්‍යයක් හෝ ප්‍රශ්නයක් ඇතුළත් කරන්න.";
                return;
            }

            if (countdownTimer) clearInterval(countdownTimer);

            translateBtn.disabled = true;
            translateBtn.style.opacity = "0.6";
            translateBtn.style.cursor = "not-allowed";

            outputDiv.innerHTML = "<div class='loading'>පිළිතුරු සකස් කරමින් පවතී...</div>";

            try {
                const result = await askGemini(text);

                if (result.text) {
                    outputDiv.innerHTML = formatMarkdown(result.text);
                } else {
                    startCountdown(60, result.error);
                }
            } catch (error) {
                startCountdown(60, `Execution Exception: ${error.message}`);
            } finally {
                translateBtn.disabled = false;
                translateBtn.style.opacity = "1";
                translateBtn.style.cursor = "pointer";
            }
        };
    </script>
</body>
</html>
