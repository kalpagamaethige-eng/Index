<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalpa AI English Translator & Teacher</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">

    <style>
        :root {
            --bg-primary: #0f172a; --bg-card: #1e293b; --border-color: #334155;
            --accent-color: #38bdf8; --accent-hover: #0ea5e9;
            --text-primary: #f8fafc; --text-secondary: #94a3b8;
        }
        body.light-mode {
            --bg-primary: #f8fafc; --bg-card: #ffffff; --border-color: #e2e8f0;
            --accent-color: #0284c7; --accent-hover: #0369a1;
            --text-primary: #0f172a; --text-secondary: #475569;
        }
        body.light-mode .lang-line { color: #0f172a; }
        body.light-mode .main-translation-box { border-color: #cbd5e1; border-left-color: #0284c7; }

        .spinner-container { display: flex; flex-direction: column; align-items: center; justify-content: center; margin-top: 20px; padding: 10px; }
        .spinner { width: 32px; height: 32px; border: 4px solid rgba(128, 128, 128, 0.2); border-top: 4px solid var(--accent-color); border-radius: 50%; animation: spin 1s linear infinite; margin-top: 15px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px; background: var(--bg-primary); color: var(--text-primary);
            max-width: 600px; margin: 0 auto; min-height: 100vh;
            display: flex; flex-direction: column; box-sizing: border-box;
            transition: background 0.3s, color 0.3s;
        }

        .header-box {
            text-align: center; margin-bottom: 15px; background: linear-gradient(135deg, var(--bg-card), var(--bg-primary));
            padding: 16px; border-radius: 14px; border: 1px solid var(--border-color); box-shadow: 0 6px 15px rgba(0, 0, 0, 0.1);
            position: relative;
        }
        h1 { color: var(--accent-color); margin: 0 0 5px 0; font-size: 20px; }
        .creator-tag { color: var(--accent-hover); font-size: 12px; font-weight: 600; margin-bottom: 3px; display: block; }
        .subtitle { color: var(--text-secondary); font-size: 11px; margin: 0; }

        /* 🪟 Settings Popup Modal Menu */
        .settings-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6); backdrop-filter: blur(3px);
            z-index: 100; align-items: center; justify-content: center;
        }
        .settings-modal.active { display: flex; }
        .settings-content {
            background: var(--bg-card); border: 1px solid var(--border-color);
            width: 90%; max-width: 340px; padding: 20px; border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); animation: scaleUp 0.2s ease;
        }
        @keyframes scaleUp { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        .settings-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px; border-bottom: 1px solid var(--border-color); padding-bottom: 10px;
        }
        .settings-header h3 { margin: 0; color: var(--accent-color); font-size: 16px; }
        .close-modal { background: none; border: none; color: var(--text-secondary); font-size: 20px; cursor: pointer; }
        
        .setting-item {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; font-size: 14px; color: var(--text-primary);
        }

        /* 🎚️ Modern Toggle Switch Styling */
        .switch { position: relative; display: inline-block; width: 44px; height: 24px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider {
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
            background-color: var(--border-color); transition: .3s; border-radius: 24px;
        }
        .slider:before {
            position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
            background-color: white; transition: .3s; border-radius: 50%;
        }
        input:checked + .slider { background-color: var(--accent-color); }
        input:checked + .slider:before { transform: translateX(20px); }

        .container { background: var(--bg-card); padding: 16px; border-radius: 14px; border: 1px solid var(--border-color); box-shadow: 0 4px 6px rgba(0,0,0,0.1); flex: 1; display: flex; flex-direction: column; transition: background 0.3s; }
        
        textarea {
            width: 100%; height: 110px; background: var(--bg-primary); color: var(--text-primary);
            border: 1px solid var(--border-color); border-radius: 10px; padding: 12px; font-size: 14px; resize: none; box-sizing: border-box;
            transition: background 0.3s, color 0.3s, border 0.3s;
        }
        textarea:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15); }

        .action-row {
            display: flex;
            gap: 8px;
            margin-top: 10px;
            align-items: center;
        }

        .side-square-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            width: 48px;
            height: 48px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s;
        }
        .side-square-btn:hover { background: var(--border-color); color: var(--text-primary); }

        button#translate {
            background: linear-gradient(135deg, var(--accent-color), var(--accent-hover));
            color: white; border: none; padding: 0 12px; height: 48px;
            border-radius: 10px; cursor: pointer; font-weight: bold;
            flex: 1; font-size: 14px; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
        }
        button#translate:active { transform: scale(0.98); }
        button#translate:disabled { opacity: 0.6; cursor: not-allowed; }

        #output { margin-top: 15px; background: var(--bg-primary); border: 1px solid var(--border-color); padding: 16px; border-radius: 10px; line-height: 1.8; font-size: 13.5px; color: var(--text-primary); flex: 1; overflow-y: auto; max-height: 50vh; transition: background 0.3s, color 0.3s, border 0.3s; }
        .heading-highlight { display: block; background: linear-gradient(90deg, var(--bg-card), var(--bg-primary)); color: var(--accent-color); padding: 9px 13px; border-radius: 8px; border-left: 4px solid var(--accent-hover); margin-top: 14px; margin-bottom: 8px; font-weight: bold; font-size: 14px; }
        .main-translation-box {
            background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-primary) 100%);
            border: 1px solid var(--border-color); border-left: 5px solid var(--accent-color);
            padding: 14px 16px; border-radius: 12px; margin: 8px 0 12px 0;
            display: flex; align-items: center; justify-content: space-between; gap: 12px; transition: all 0.3s;
        }
        .translation-content { flex: 1; display: flex; flex-direction: column; gap: 6px; }
        .lang-line { font-size: 14.5px; font-weight: 600; line-height: 1.4; color: var(--text-primary); }
        .lang-line.sinhala { color: #facc15; font-size: 14px; }
        body.light-mode .lang-line.sinhala { color: #d97706; }
        .speak-btn { background: linear-gradient(135deg, var(--accent-color), var(--accent-hover)); color: white; border: none; border-radius: 10px; width: 44px; height: 44px; font-size: 18px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all 0.2s ease; }
        .speak-btn:hover { transform: translateY(-2px); }
        .loading { color: var(--accent-color); font-style: italic; text-align: center; margin-top: 20px; }
        .error-box { background: #450a0a; border: 1px solid #ef4444; color: #fca5a5; padding: 16px; border-radius: 8px; text-align: center; }
        body.light-mode .error-box { background: #fee2e2; border-color: #f87171; color: #b91c1c; }
        .countdown-text { color: #facc15; font-weight: bold; background: #291805; padding: 4px 10px; border-radius: 6px; border: 1px solid #eab308; display: inline-block; margin-top: 8px; }
        body.light-mode .countdown-text { background: #fef3c7; border-color: #f59e0b; color: #92400e; }
    </style>
</head>
<body>
    <div class="header-box">
        <span class="creator-tag">Created by Kalpa Gamaethige</span>
        <h1>KALPA AI English Translator & Teacher</h1>
        <p class="subtitle">ද්විභාෂා පරිවර්තනය, ව්‍යාකරණ නිවැරදි කිරීම සහ ඉගෙනුම් සහකරු</p>
    </div>

    <!-- 🪟 Settings Popup Modal Menu -->
    <div class="settings-modal" id="settings-modal">
        <div class="settings-content">
            <div class="settings-header">
                <h3>⚙️ යෙදුම් සැකසුම් (Settings)</h3>
                <button class="close-modal" id="close-settings">&times;</button>
            </div>
            
            <!-- 🌓 දිවා / රාත්‍රී Mode Switch එක -->
            <div class="setting-item">
                <span>🌙 රාත්‍රී ප්‍රකාරය (Dark Mode)</span>
                <label class="switch">
                    <input type="checkbox" id="dark-mode-switch">
                    <span class="slider"></span>
                </label>
            </div>
        </div>
    </div>

    <div class="container">
        <textarea id="input" placeholder="මෙතැනට ඔබේ වාක්‍යය හෝ ප්‍රශ්නය ලියන්න (උදා: I go to school yesterday)..."></textarea>
        
        <div class="action-row">
            <!-- ⚙️ වම් පැත්තේ Settings බටන් එක -->
            <button class="side-square-btn" id="settings-btn" title="Settings (සැකසුම්)">⚙️</button>
            <button id="translate">✨ Translate Now (පරිවර්තනය)</button>
            <button class="side-square-btn" id="advanced-btn" title="Advanced (වැඩිදුර විශේෂාංග)">🚀</button>
        </div>

        <div id="output">පිළිතුර මෙහි දිස් වනු ඇත...</div>
    </div>

    <script>
        const body = document.body;
        const settingsModal = document.getElementById('settings-modal');
        const settingsBtn = document.getElementById('settings-btn');
        const closeSettings = document.getElementById('close-settings');
        const darkModeSwitch = document.getElementById('dark-mode-switch');

        // Theme එක LocalStorage එකෙන් Load කර ගැනීම
        const savedTheme = localStorage.getItem('theme');
        if (savedTheme === 'light') {
            body.classList.add('light-mode');
            darkModeSwitch.checked = false;
        } else {
            darkModeSwitch.checked = true;
        }

        // වම් පැත්තේ Settings බටන් එක ක්ලික් කළ විට Modal එක විවෘත වීම
        settingsBtn.addEventListener('click', () => {
            settingsModal.classList.add('active');
        });

        // Modal එක වසා දැමීම
        closeSettings.addEventListener('click', () => {
            settingsModal.classList.remove('active');
        });

        // Modal එකෙන් පිටත ක්ලික් කළහොත් වැසී යාම
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) {
                settingsModal.classList.remove('active');
            }
        });

        // Switch එක මඟින් Light/Dark Mode මාරු කිරීම
        darkModeSwitch.addEventListener('change', () => {
            if (darkModeSwitch.checked) {
                body.classList.remove('light-mode');
                localStorage.setItem('theme', 'dark');
            } else {
                body.classList.add('light-mode');
                localStorage.setItem('theme', 'light');
            }
        });

        document.getElementById('advanced-btn').addEventListener('click', () => {
            alert("🚀 Advanced පිටු වෙත පිවිසීම මෙහි ක්‍රියාත්මක කළ හැක.");

        let countdownTimer = null;
        const MODELS = ["gemini-3.6-flash", "gemini-2.0-flash", "gemini-1.5-flash"];
        const BLOCK_DURATION = 86400000;

        function isKeyBlocked(index) {
            const blockedTime = localStorage.getItem(`blocked_key_${index}`);
            if (!blockedTime) return false;
            if (new Date().getTime() - parseInt(blockedTime) > BLOCK_DURATION) {
                localStorage.removeItem(`blocked_key_${index}`); return false;
            }
            return true;
        }
        function blockKey(index) { localStorage.setItem(`blocked_key_${index}`, new Date().getTime().toString()); }
        function getActiveApiKey(index) { try { return atob(ENCODED_KEYS[index].trim()); } catch (e) { return ""; } }

        const systemPrompt = `You are an expert bilingual English-Sinhala AI teacher and translator.
Your responsibilities: 1. Translate English ↔ Sinhala accurately. 2. Identify Tense. 3. Correct grammar.
4. Provide Main Translation: EN_TEXT || SI_TEXT 5. Breakdown 6. Answer Questions 7. Multiple Meanings
8. 5 Similar Examples 9. Practice Question.
Format: ### 🇱🇰 ප්‍රධාන පරිවර්තනය (Main Translation) EN_TEXT || SI_TEXT... ### 💬 අභ්‍යාස ප්‍රශ්නය (Practice Question)`;

        function startCountdown(fallbackSeconds, errorMessage) {
            const outputDiv = document.getElementById("output");
            let remaining = fallbackSeconds;
            if (countdownTimer) clearInterval(countdownTimer);
            outputDiv.innerHTML = `<div class="error-box"><span style="font-size: 24px;">⏳</span><strong>API සීමාව / දෝෂයක්</strong><p>සියලුම API Keys සහ Models අසාර්ථක විය.</p><div class="countdown-text">තත්පර <span id="timer-count">${remaining}</span> කින් නැවත උත්සාහ කරන්න...</div></div>`;
            countdownTimer = setInterval(() => {
                remaining--; const timerElement = document.getElementById("timer-count");
                if (remaining <= 0) { clearInterval(countdownTimer); outputDiv.innerHTML = `<div class="loading">✅ නැවත උත්සාහ කළ හැක.</div>`; }
                else { if (timerElement) timerElement.innerText = remaining; }
            }, 1000);
        }

        async function askGemini(promptText) {
            let collectedErrors = [];
            for (const model of MODELS) {
                for (let i = 0; i < ENCODED_KEYS.length; i++) {
                    if (isKeyBlocked(i)) continue;
                    const currentApiKey = getActiveApiKey(i);
                    if (!currentApiKey) continue;
                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${currentApiKey}`;
                    const payload = { contents: [{ role: "user", parts: [{ text: systemPrompt + "\n\nUser Input: " + promptText }] }] };

                    try {
                        const response = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload) });
                        const data = await response.json();
                        if (response.ok && data?.candidates?.[0]?.content?.parts?.[0]?.text) {
                            return { text: data.candidates[0].content.parts[0].text, error: null };
                        } else { collectedErrors.push(`${model} Key${i}: ${data.error?.message}`); blockKey(i); }
                    } catch (error) { collectedErrors.push(`${model} Key${i}: ${error.message}`); blockKey(i); }
                }
            }
            return { text: null, error: collectedErrors.join('\n') };
        }

        function speakBilingual(enText, siText) {
            if (!('speechSynthesis' in window)) { alert("Voice පහසුකම නැත."); return; }
            window.speechSynthesis.cancel();
            const speak = (text, lang, rate) => { if(!text) return; const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = rate; window.speechSynthesis.speak(u); }
            if (enText) { speak(enText, 'en-US', 0.9); if (siText) setTimeout(() => speak(siText, 'si-LK', 0.95), 600); }
            else if (siText) speak(siText, 'si-LK', 0.95);
        }

        function formatMarkdown(text) {
            if (!text) return "";
            let formatted = text.replace(/^---$/gim, '');
            formatted = formatted.replace(/^(.*?)\s*\|\s*(.*?)$/gim, (match, enText, siText) => {
                let cleanEn = enText.replace(/\*\*/g, '').trim();
                let cleanSi = siText.replace(/\*\*/g, '').trim();
                if (!cleanEn && !cleanSi) return match;
                let safeEn = cleanEn.replace(/'/g, "\\'"); let safeSi = cleanSi.replace(/'/g, "\\'");
                return `<div class="main-translation-box"><div class="translation-content"><div class="lang-line english">🇬🇧 ${cleanEn}</div><div class="lang-line sinhala">🇱🇰 ${cleanSi}</div></div><button class="speak-btn" onclick="speakBilingual('${safeEn}', '${safeSi}')" title="ශ්‍රවණය කරන්න">🔊</button></div>`;
            });
            formatted = formatted.replace(/(?:###|##)\s*(.*$)/gim, (match, title) => `<span class="heading-highlight">${title.replace(/\*\*/g, '').trim()}</span>`);
            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/^\s*-\s+/gim, '• ');
            return formatted.split('\n').map(line => line.trim()).filter(line => line).join('<br>');
        }

        document.getElementById("translate").onclick = async () => {
            const inputField = document.getElementById("input");
            const outputDiv = document.getElementById("output");
            const translateBtn = document.getElementById("translate");
            const text = inputField.value.trim();
            if (!text) { outputDiv.innerText = "කරුණාකර වාක්‍යයක් ඇතුළත් කරන්න."; return; }
            if (countdownTimer) clearInterval(countdownTimer);

            const cacheKey = `trans_cache_${text.toLowerCase()}`;
            const keys = Object.keys(localStorage).filter(k => k.startsWith('trans_cache_'));
            if(keys.length > 50) localStorage.removeItem(keys[0]);
            const cachedResult = localStorage.getItem(cacheKey);
            if (cachedResult) {
                outputDiv.innerHTML = formatMarkdown(cachedResult) + "<br><br><span style='font-size: 11px; color: var(--text-secondary); text-align: center;'>(⚡ මතකයෙන්)</span>";
                return;
            }

            translateBtn.disabled = true; translateBtn.innerHTML = "↻ Please wait...";
            outputDiv.innerHTML = "<div class='spinner-container'><div style='font-size: 14.5px; color: var(--accent-color);'>ගුරුවරයා පිළිතුර සකස් කරමින් පවතී...</div><div class='spinner'></div></div>";

            try {
                const result = await askGemini(text);
                if (result.text) {
                    localStorage.setItem(cacheKey, result.text);
                    outputDiv.innerHTML = formatMarkdown(result.text);
                } else { startCountdown(60, result.error); }
            } catch (error) { startCountdown(60, `Exception: ${error.message}`); }
            finally { translateBtn.disabled = false; translateBtn.innerHTML = "✨ Translate Now (පරිවර්තනය)"; }
