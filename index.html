<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalpa AI English Translator & Teacher</title>
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 20px;
            background: var(--bg-primary);
            color: var(--text-primary);
            max-width: 850px;
            margin: 0 auto;
            line-height: 1.5;
        }

        .header-box {
            text-align: center;
            margin-bottom: 25px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 20px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 8px 0;
            font-size: 24px;
            letter-spacing: 0.5px;
        }

        .creator-tag {
            color: var(--accent-hover);
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 5px;
            display: block;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 13px;
            margin: 0;
        }

        .container {
            background: var(--bg-card);
            padding: 24px;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        textarea {
            width: 100%;
            height: 130px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            font-size: 15px;
            resize: none;
            box-sizing: border-box;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
        }

        button {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            padding: 14px 20px;
            margin-top: 12px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 15px;
            transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
        }

        button:hover {
            background: linear-gradient(135deg, #0284c7, #0369a1);
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        #output {
            margin-top: 24px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 20px;
            border-radius: 12px;
            white-space: pre-wrap;
            line-height: 1.7;
            min-height: 120px;
            font-size: 14px;
            color: #e2e8f0;
        }

        .loading {
            color: var(--accent-color);
            font-style: italic;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .loading::after {
            content: "";
            width: 16px;
            height: 16px;
            border: 2px solid var(--accent-color);
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="header-box">
        <span class="creator-tag">Created by Kalpa Gamaethige</span>
        <h1>KALPA AI English Translator & Teacher</h1>
        <p class="subtitle">ද්විභාෂා පරිවර්තනය, ව්‍යාකරණ නිවැරදි කිරීම සහ ඉංග්‍රීසි ඉගෙනුම් සහකරු</p>
    </div>

    <div class="container">
        <textarea id="input" placeholder="මෙතැනට ඔබේ වාක්‍යය හෝ ප්‍රශ්නය ලියන්න (උදා: I goes to school yesterday)..."></textarea>
        <button id="translate">Translate & Learn (පරිවර්තනය කර ඉගෙන ගන්න)</button>
        <div id="output">පිළිතුර මෙහි දිස් වනු ඇත...</div>
    </div>

    <script>
        // ⚠️ Base64 Encode කරගත් API Key එක පහත උඩුකොමා (" ") ඇතුළට Paste කරන්න
        const ENCODED_KEY = "QVEuQWI4Uk42SWl4Rm1yMFBweUwyQ2FCQ0pUQkd2SU1OZ2lta1VjQ2JrRXF1a0wtZk9XOWc=";

        function getApiKey() {
            try {
                return atob(ENCODED_KEY.trim());
            } catch (e) {
                return "";
            }
        }

        const systemPrompt = `You are an expert bilingual English-Sinhala AI teacher and translator.
Your responsibilities:
1. Translate English ↔ Sinhala accurately.
2. Correct grammar mistakes and awkward phrasing in the user's input.
3. Explain grammar in simple Sinhala.
4. Give beginner and advanced examples based on the structure.
5. Explain difficult vocabulary clearly.
6. Teach pronunciation guidance (using simple Sinhala phonetic representation).
7. Encourage conversation practice and maintain a friendly, professional, and supportive language teacher tone.
8. Always ask a relevant follow-up question in both English and Sinhala to keep the learning practice going.

Format your responses neatly with clear headings:
- **පරිවර්තනය (Translation)**:
- **නිවැරදි කළ වාක්‍යය (Corrected Sentence)**:
- **ව්‍යාකරණ පැහැදිලි කිරීම (Grammar Explanation)**:
- **උදාහරණ (Examples - Beginner & Advanced)**:
- **උච්චාරණය හා වචන මාලාව (Pronunciation & Vocabulary)**:
- **අභ්‍යාස ප්‍රශ්නය (Practice Question)**:`;

        async function askGemini(promptText) {
            const apiKey = getApiKey();
            // Modern gemini-2.5-flash endpoint
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
            
            const payload = {
                contents: [{
                    role: "user",
                    parts: [{ text: promptText }]
                }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            const response = await fetch(url, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json().catch(() => ({}));
                const msg = errData.error?.message || `HTTP Status ${response.status}`;
                throw new Error(msg);
            }

            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "පිළිතුරක් ලැබුණේ නැත.";
        }

        document.getElementById("translate").onclick = async () => {
            let text = document.getElementById("input").value.trim();
            if (!text) return;
            
            let outputDiv = document.getElementById("output");
            outputDiv.innerHTML = "<div class='loading'>ගුරුවරයා පිළිතුරු සකස් කරමින් පවතී...</div>";
            
            try {
                let result = await askGemini(text);
                outputDiv.innerText = result;
            } catch (error) {
                outputDiv.innerHTML = `<b style="color: #ef4444;">දෝෂය:</b> ${error.message}`;
            }
        };
    </script>
</body>
</html>
