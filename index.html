<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalpa AI English Translator & Teacher</title>
    <!-- PWA සඳහා අවශ්‍ය Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px;
            background: var(--bg-primary);
            color: var(--text-primary);
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .header-box {
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 5px 0;
            font-size: 20px;
        }

        .creator-tag {
            color: var(--accent-hover);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 3px;
            display: block;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 11px;
            margin: 0;
        }

        .container {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
        }

        button {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 14px;
            transition: all 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        #output {
            margin-top: 15px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            line-height: 1.7;
            font-size: 13.5px;
            color: #e2e8f0;
            flex: 1;
            overflow-y: auto;
            max-height: 50vh;
        }

        .heading-highlight {
            display: block;
            background: linear-gradient(90deg, #1e293b, #0f172a);
            color: var(--accent-color);
            padding: 8px 12px;
            border-radius: 6px;
            border-left: 3.5px solid var(--accent-hover);
            margin-top: 15px;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        .loading {
            color: var(--accent-color);
            font-style: italic;
            text-align: center;
            margin-top: 20px;
        }

        .error-box {
            background: #450a0a;
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 14px;
            border-radius: 8px;
            font-size: 12.5px;
            white-space: pre-wrap;
            line-height: 1.6;
            word-break: break-word;
        }

        .countdown-text {
            color: #facc15;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            margin-top: 8px;
            background: #291805;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #eab308;
        }
    </style>
</head>
<body>
    <div class="header-box">
        <span class="creator-tag">Created by Kalpa Gamaethige</span>
        <h1>KALPA AI English Translator & Teacher</h1>
        <p class="subtitle">ද්විභාෂා පරිවර්තනය, ව්‍යාකරණ නිවැරදි කිරීම සහ ඉගෙනුම් සහකරු</p>
    </div>

    <div class="container">
        <textarea id="input" placeholder="මෙතැනට ඔබේ වාක්‍යය හෝ ප්‍රශ්නය ලියන්න (උදා: I goes to school yesterday)..."></textarea>
        <button id="translate">Translate & Learn (පරිවර්තනය කර ඉගෙන ගන්න)</button>
        <div id="output">පිළිතුර මෙහි දිස් වනු ඇත...</div>
    </div>

    <script>
        // 🔑 Base64 Encode කරන ලද API Keys ඇතුළත් කරන්න
        const ENCODED_KEYS = [
            "QVEuQWI4Uk42STl6VE9GdzFnNXVsWEJKYlMzNmpqM3ZEeWNrX2pOcUM4czFXQ2h5TDNvSGc",
            "QVEuQWI4Uk42TGI5bWt2SXBYWGoyQ0tVb3lRUjh2bnIwZ3g5aGNmOUtaZTF1WC1MUjd1V3c",
            "QVEuQWI4Uk42SlpQZ1NoeFREU3hXZXRZSjRpODJ6MkVoVVd3WEFOeWdFRWdSSjdIWFFWVXc"
        ];

        let currentKeyIndex = 0;
        let countdownTimer = null;

        function getActiveApiKey() {
            try {
                const encodedKey = ENCODED_KEYS[currentKeyIndex];
                if (!encodedKey || encodedKey.includes("YOUR_")) return "";
                return atob(encodedKey.trim());
            } catch (e) {
                console.error("Error decoding API Key:", e);
                return "";
            }
        }

        function rotateApiKey() {
            if (ENCODED_KEYS.length > 1) {
                currentKeyIndex = (currentKeyIndex + 1) % ENCODED_KEYS.length;
            }
        }

        const systemPrompt = `You are an expert bilingual English-Sinhala AI teacher and translator.
Your responsibilities:
1. Translate English ↔ Sinhala accurately.
2. Correct grammar mistakes and awkward phrasing in the user's input.
3. Explain grammar in simple Sinhala.
4. Give beginner and advanced examples based on the structure.
5. Explain difficult vocabulary clearly.
6. Teach pronunciation guidance (using simple Sinhala phonetic representation).
7. Encourage conversation practice and maintain a friendly, professional, and supportive language teacher tone.
8. Always ask a relevant follow-up question in both English and Sinhala to keep the learning practice going.

Format your responses neatly with clear headings:
### 🇱🇰 පරිවර්තනය (Translation)
### ✍️ නිවැරදි කළ වාක්‍යය (Corrected Sentence)
### 📖 ව්‍යාකරණ පැහැදිලි කිරීම (Grammar Explanation)
### 💡 උදාහරණ (Examples - Beginner & Advanced)
### 🗣️ උච්චාරණය හා වචන මාලාව (Pronunciation & Vocabulary)
### 💬 අභ්‍යාස ප්‍රශ්නය (Practice Question)`;

        function startCountdown(seconds, errorMessage) {
            const outputDiv = document.getElementById("output");
            let remaining = seconds;

            if (countdownTimer) clearInterval(countdownTimer);

            function updateDisplay() {
                outputDiv.innerHTML = `
                    <div class="error-box">
                        ⚠️ <strong>දෝෂයක් සිදුවී ඇත (Error Display):</strong>\n
                        ${errorMessage}\n\n
                        ⏳ <strong>නැවත සක්‍රිය වන වේලාව (Countdown):</strong><br>
                        <span class="countdown-text">තත්පර ${remaining} කින් නැවත උත්සාහ කරන්න...</span>
                    </div>`;
            }

            updateDisplay();

            countdownTimer = setInterval(() => {
                remaining--;
                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    outputDiv.innerHTML = `<div class="loading" style="color: #4ade80;">✅ API එක නැවත සක්‍රිය විය! කරුණාකර 'Translate & Learn' මත නැවත Click කරන්න.</div>`;
                } else {
                    updateDisplay();
                }
            }, 1000);
        }

        async function askGemini(promptText) {
            let attempts = 0;
            const activeKeysCount = ENCODED_KEYS.filter(k => k && !k.includes("YOUR_")).length;
            const maxAttempts = (activeKeysCount || 1) * 2;
            let collectedErrors = [];

            while (attempts < maxAttempts) {
                const currentApiKey = getActiveApiKey();

                if (!currentApiKey) {
                    rotateApiKey();
                    attempts++;
                    continue;
                }

                // 🌟 REST URL එක සහ Header Authentication හරහා ද්විත්ව පරීක්ෂාව
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${currentApiKey}`;

                const payload = {
                    contents: [{
                        role: "user",
                        parts: [{ text: promptText }]
                    }],
                    systemInstruction: {
                        parts: [{ text: systemPrompt }]
                    }
                };

                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { 
                            "Content-Type": "application/json",
                            "Authorization": `Bearer ${currentApiKey}`
                        },
                        body: JSON.stringify(payload)
                    });

                    const data = await response.json();

                    if (response.status === 429 || response.status === 403) {
                        const rateMsg = data.error?.message || "Rate limit exceeded (Too many requests)";
                        collectedErrors.push(`Key Index [${currentKeyIndex + 1}] (Status ${response.status}): ${rateMsg}`);
                        rotateApiKey();
                        attempts++;
                        await new Promise(res => setTimeout(res, 1500));
                        continue;
                    }

                    if (!response.ok) {
                        const errDetails = data.error?.message || 'Request failed';
                        collectedErrors.push(`Key Index [${currentKeyIndex + 1}] (Status ${response.status}): ${errDetails}`);
                        rotateApiKey();
                        attempts++;
                        continue;
                    }

                    if (data && data.candidates && data.candidates[0] && data.candidates[0].content && data.candidates[0].content.parts) {
                        return { text: data.candidates[0].content.parts[0].text, error: null };
                    } else {
                        collectedErrors.push(`Key Index [${currentKeyIndex + 1}]: Invalid response structure received from Google server.`);
                        rotateApiKey();
                        attempts++;
                    }

                } catch (error) {
                    collectedErrors.push(`Key Index [${currentKeyIndex + 1}]: Network Error (${error.message})`);
                    rotateApiKey();
                    attempts++;
                }
            }

            return { text: null, error: collectedErrors.join('\n') };
        }

        function formatMarkdown(text) {
            if (!text) return "";

            let formatted = text;

            formatted = formatted.replace(/^---$/gim, '');

            formatted = formatted.replace(/(?:###|- \*\*|\*\*)\s*(.*?)(?:\*\*|$)/gim, (match, title) => {
                let cleanTitle = title.replace(/\*\*/g, '').replace(/^###\s*/, '').trim(); 
                if (!cleanTitle) return "";
                return `<span class="heading-highlight">${cleanTitle}</span>`;
            });

            formatted = formatted.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            formatted = formatted.replace(/^\*\s+/gim, '• ');

            formatted = formatted.replace(/\n\s*\n/g, '<br><br>');
            formatted = formatted.replace(/\n/g, '<br>');

            return formatted;
        }

        document.getElementById("translate").onclick = async () => {
            const inputField = document.getElementById("input");
            const outputDiv = document.getElementById("output");
            const translateBtn = document.getElementById("translate");
            const text = inputField.value.trim();

            if (!text) {
                outputDiv.innerText = "කරුණාකර යම් වාක්‍යයක් හෝ ප්‍රශ්නයක් ඇතුළත් කරන්න.";
                return;
            }

            if (countdownTimer) clearInterval(countdownTimer);

            translateBtn.disabled = true;
            translateBtn.style.opacity = "0.6";
            translateBtn.style.cursor = "not-allowed";

            outputDiv.innerHTML = "<div class='loading'>ගුරුවරයා පිළිතුරු සකස් කරමින් පවතී...</div>";

            try {
                const result = await askGemini(text);

                if (result.text) {
                    outputDiv.innerHTML = formatMarkdown(result.text);
                } else {
                    startCountdown(60, result.error);
                }
            } catch (error) {
                startCountdown(60, `General Execution Exception: ${error.message}`);
            } finally {
                translateBtn.disabled = false;
                translateBtn.style.opacity = "1";
                translateBtn.style.cursor = "pointer";
            }
        };
    </script>
</body>
</html>
