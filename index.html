<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalpa AI English Translator & Teacher Ver 2.2 Pro</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        .spinner-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-top: 20px;
            padding: 10px;
        }

        .spinner {
            width: 32px;  
            height: 32px; 
            border: 4px solid rgba(255, 255, 255, 0.15); 
            border-top: 4px solid var(--accent-color); 
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-top: 15px; 
            display: inline-block;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px;
            background: var(--bg-primary);
            color: var(--text-primary);
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .header-box {
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 5px 0;
            font-size: 20px;
        }

        .creator-tag {
            color: var(--accent-hover);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 3px;
            display: block;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 11px;
            margin: 0;
        }

        .container {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
        }

        button#translate {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 14px;
            transition: all 0.2s;
        }

        button#translate:active {
            transform: scale(0.98);
        }

        #output {
            margin-top: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .output-box-wrapper {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 14px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .output-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--accent-color);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .output-content {
            font-size: 13.5px;
            color: #e2e8f0;
            line-height: 1.7;
        }

        .heading-highlight {
            display: block;
            background: linear-gradient(90deg, #1e293b, #0f172a);
            color: var(--accent-color);
            padding: 8px 12px;
            border-radius: 8px;
            border-left: 4px solid var(--accent-hover);
            margin-top: 10px;   
            margin-bottom: 6px; 
            font-weight: bold;
            font-size: 13.5px;
        }

        /* ස්පීකර් සලකුණ ඇති ප්‍රධාන පෙට්ටියේ රාමුව සහ පෙනුම */
        .main-translation-box {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border: 1px solid #ffffff;
            border-left: 5px solid #ffffff;
            color: #ffffff;
            padding: 12px 14px;
            border-radius: 10px;
            margin: 6px 0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.35);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .translation-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .lang-line {
            font-size: 14.5px;
            font-weight: 600;
            line-height: 1.4;
            color: #f8fafc;
        }

        .lang-line.sinhala {
            color: #fef08a;
            font-size: 14px;
        }

        .speak-btn {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: 1px solid #38bdf8;
            border-radius: 10px;
            width: 42px;
            height: 42px;
            font-size: 18px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            box-shadow: 0 4px 10px rgba(14, 165, 233, 0.3);
            transition: all 0.2s ease;
        }

        .speak-btn:hover {
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            transform: translateY(-2px);
        }

        .speak-btn:active {
            transform: scale(0.95);
        }

        .loading {
            color: var(--accent-color);
            font-style: italic;
            text-align: center;
            margin-top: 20px;
        }

        .error-box {
            background: #450a0a;
            border: 1px solid #ef4444;
            color: #fca5a5;
            padding: 16px;
            border-radius: 8px;
            font-size: 12.5px;
            line-height: 1.6;
            text-align: center;
        }

        .countdown-text {
            color: #facc15;
            font-weight: bold;
            font-size: 13px;
            display: inline-block;
            margin-top: 8px;
            background: #291805;
            padding: 4px 10px;
            border-radius: 6px;
            border: 1px solid #eab308;
        }
    </style>
</head>

        let countdownTimer = null;

        function isKeyBlocked(index) {
            const blockedTime = localStorage.getItem(`blocked_key_${index}`);
            if (!blockedTime) return false;
            const now = new Date().getTime();
            if (now - parseInt(blockedTime) > 86400000) {
                localStorage.removeItem(`blocked_key_${index}`);
                return false;
            }
            return true;
        }

        function blockKey(index) {
            const now = new Date().getTime();
            localStorage.setItem(`blocked_key_${index}`, now.toString());
        }

        function getValidKeyIndex() {
            for (let i = 0; i < ENCODED_KEYS.length; i++) {
                if (!isKeyBlocked(i)) {
                    const encodedKey = ENCODED_KEYS[i];
                    if (encodedKey && !encodedKey.includes("YOUR_")) {
                        return i;
                    }
                }
            }
            return -1;
        }

        function getActiveApiKey(index) {
            try {
                const encodedKey = ENCODED_KEYS[index];
                if (!encodedKey || encodedKey.includes("YOUR_")) return "";
                return atob(encodedKey.trim());
            } catch (e) {
                return "";
            }
        }

        // ඉතා පැහැදිලි කොටස් තුනකට ප්‍රතිඵල වෙන් කර ලබා ගැනීමට සකස් කළ System Prompt එක
        const systemPrompt = `You are an expert bilingual English-Sinhala AI teacher and translator.
When the user inputs a sentence, question, or general query, you must return your response structured cleanly into THREE distinct sections using the exact markers below:

===TRANSLATION===
Provide ONLY the accurate translation in format: [EN_TEXT] || [SI_TEXT] (Do NOT use brackets []). If it's a general question, provide a short direct translated representation or core statement.

===ANSWER===
Provide comprehensive answers, grammar explanations, tense details, structure breakdown (Subject, Verb, Object), or answers to any general question asked by the user in both English and Sinhala.

===EXAMPLES===
Provide exactly 5 similar example sentences, patterns, or vocabulary items related to the user input in format:
1. EN_EX1 || SI_EX1
2. EN_EX2 || SI_EX2
3. EN_EX3 || SI_EX3
4. EN_EX4 || SI_EX4
5. EN_EX5 || SI_EX5`;

        function startCountdown(fallbackSeconds, errorMessage) {
            const outputDiv = document.getElementById("output");
            let remaining = fallbackSeconds;
            
            if (countdownTimer) clearInterval(countdownTimer);

            outputDiv.innerHTML = `
                <div class="error-box" style="background: #1e293b; border: 1px solid #eab308; color: #f8fafc; padding: 25px 20px;">
                    <span style="font-size: 24px; margin-bottom: 12px; display: block;">⏳</span>
                    <strong style="color: #facc15; font-size: 16px; display: block; margin-bottom: 8px;">දෛනික සීමාව ඉක්මවා ඇත!</strong>
                    <p style="font-size: 13.5px; margin: 12px auto; color: #cbd5e1; line-height: 1.6;">
                        අපගේ නොමිලේ භාවිතා කල සීමාව අවසන් වී ඇත. කරුණාකර පසුව නැවත උත්සාහ කරන්න.
                    </p>
                    <div class="countdown-text">
                        තත්පර <span id="timer-count">${remaining}</span> කින් නැවත සක්‍රිය වේ...
                    </div>
                </div>`;

            countdownTimer = setInterval(() => {
                remaining--;
                const timerElement = document.getElementById("timer-count");
                if (remaining <= 0) {
                    clearInterval(countdownTimer);
                    outputDiv.innerHTML = `<div class="loading" style="color: #4ade80; text-align: center; margin-top: 10px; font-weight: bold;">✅ සේවාව නැවත සක්‍රියයි. Translate බොත්තම ඔබන්න.</div>`;
                } else {
                    if (timerElement) timerElement.innerText = remaining;
                }
            }, 1000);
        }

        async function askGemini(promptText) {
            let attempts = 0;
            const maxAttempts = ENCODED_KEYS.length;

            while (attempts < maxAttempts) {
                let currentIndex = getValidKeyIndex();
                if (currentIndex === -1) break;

                const currentApiKey = getActiveApiKey(currentIndex);
                if (!currentApiKey) {
                    blockKey(currentIndex);
                    attempts++;
                    continue;
                }

                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${currentApiKey}`;
                const payload = {
                    contents: [{ role: "user", parts: [{ text: promptText }] }],
                    systemInstruction: { parts: [{ text: systemPrompt }] }
                };

                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify(payload)
                    });
                    const data = await response.json();

                    if (!response.ok) {
                        blockKey(currentIndex);
                        attempts++;
                        continue;
                    }

                    if (data?.candidates?.[0]?.content?.parts?.[0]?.text) {
                        return { text: data.candidates[0].content.parts[0].text, error: null };
                    } else {
                        blockKey(currentIndex);
                        attempts++;
                    }
                } catch (error) {
                    blockKey(currentIndex);
                    attempts++;
                }
            }
            return { text: null, error: "API Limit Reached" };
        }

        function speakBilingual(enText, siText) {
            if (!('speechSynthesis' in window)) {
                alert("ඔබගේ Browser එකෙහි Voice පහසුකම සහය නොදක්වයි.");
                return;
            }

            window.speechSynthesis.cancel();

            if (enText) {
                const enUtterance = new SpeechSynthesisUtterance(enText);
                enUtterance.lang = 'en-US';
                enUtterance.rate = 0.9;
                
                enUtterance.onend = () => {
                    if (siText) {
                        const siUtterance = new SpeechSynthesisUtterance(siText);
                        siUtterance.lang = 'si-LK';
                        siUtterance.rate = 0.95;
                        window.speechSynthesis.speak(siUtterance);
                    }
                };

                window.speechSynthesis.speak(enUtterance);
            } else if (siText) {
                const siUtterance = new SpeechSynthesisUtterance(siText);
                siUtterance.lang = 'si-LK';
                siUtterance.rate = 0.95;
                window.speechSynthesis.speak(siUtterance);
            }
        }

        function formatPairBox(textLine) {
            let parts = textLine.split('||');
            if (parts.length < 2) return `<div class="lang-line">${textLine.replace(/\*\*/g, '').replace(/[\[\]()]/g, '')}</div>`;
            let cleanEn = parts[0].replace(/\*\*/g, '').replace(/[\[\]()]/g, '').trim();
            let cleanSi = parts[1].replace(/\*\*/g, '').replace(/[\[\]()]/g, '').trim();
            if (!cleanEn && !cleanSi) return "";
            
            let safeEn = cleanEn.replace(/'/g, "\\'");
            let safeSi = cleanSi.replace(/'/g, "\\'");

            return `<div class="main-translation-box">
                <div class="translation-content">
                    <div class="lang-line english" style="color: #ffffff;">🇬🇧 ${cleanEn}</div>
                    <div class="lang-line sinhala" style="color: #fef08a;">🇱🇰 ${cleanSi}</div>
                </div>
                <button class="speak-btn" onclick="speakBilingual('${safeEn}', '${safeSi}')" title="ශ්‍රවණය කරන්න">🔊</button>
            </div>`;
        }

        function parseAndDisplayResponse(rawText) {
            if (!rawText) return;

            let transSection = "";
            let answerSection = "";
            let examplesSection = "";

            if (rawText.includes("===TRANSLATION===") || rawText.includes("===ANSWER===")) {
                let partsTrans = rawText.split("===TRANSLATION===");
                let afterTrans = partsTrans[1] || rawText;
                let splitAnswer = afterTrans.split("===ANSWER===");
                let transText = splitAnswer[0] || "";
                let restAfterAns = splitAnswer[1] || "";
                let splitExamples = restAfterAns.split("===EXAMPLES===");
                let ansText = splitExamples[0] || "";
                let exText = splitExamples[1] || "";

                transSection = transText.trim();
                answerSection = ansText.trim();
                examplesSection = exText.trim();
            } else {
                transSection = rawText;
                answerSection = "විශේෂ පැහැදිලි කිරීමක් නොමැත.";
                examplesSection = "";
            }

            // 1. ප්‍රධාන පරිවර්තන කොටුව හැඩගැන්වීම
            let transLines = transSection.split('\n').map(l => l.trim()).filter(l => l);
            let transHtml = "";
            transLines.forEach(line => {
                if (line.includes("||")) {
                    transHtml += formatPairBox(line);
                } else {
                    transHtml += `<div class="lang-line" style="padding: 6px 0;">${line.replace(/\*\*/g, '').replace(/[\[\]()]/g, '')}</div>`;
                }
            });

            // 2. AI පිළිතුර සහ පැහැදිලි කිරීමේ කොටුව හැඩගැන්වීම
            let formattedAnswer = answerSection
                .replace(/(?:###|##)\s*(.*$)/gim, '<span class="heading-highlight">$1</span>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/^\s*-\s+/gim, '• ')
                .split('\n').map(l => l.trim()).filter(l => l).join('<br>');

            // 3. උදාහරණ වාක්‍ය 5 ක කොටුව හැඩගැන්වීම
            let exLines = examplesSection.split('\n').map(l => l.trim()).filter(l => l);
            let exHtml = "";
            exLines.forEach(line => {
                let cleanLine = line.replace(/^\d+[\.\)]\s*/, '');
                if (cleanLine.includes("||")) {
                    exHtml += formatPairBox(cleanLine);
                } else if (cleanLine) {
                    exHtml += `<div class="lang-line" style="padding: 4px 0;">• ${cleanLine.replace(/\*\*/g, '')}</div>`;
                }
            });

            // UI එකට කොටස් තුන නිවැරදිව ඇතුළත් කිරීම
            const outputDiv = document.getElementById("output");
            outputDiv.innerHTML = `
                <div class="output-box-wrapper">
                    <div class="output-title">🌐 ප්‍රධාන පරිවර්තනය (Main Translation)</div>
                    <div class="output-content">${transHtml || "පරිවර්තනයක් නොමැත."}</div>
                </div>

                <div class="output-box-wrapper">
                    <div class="output-title">💡 AI පිළිතුර සහ පැහැදිලි කිරීම (AI Answer & Explanation)</div>
                    <div class="output-content">${formattedAnswer || "පැහැදිලි කිරීම් නොමැත."}</div>
                </div>

                <div class="output-box-wrapper">
                    <div class="output-title">📚 උදාහරණ වාක්‍ය 5 ක් (5 Similar Examples)</div>
                    <div class="output-content">${exHtml || "උදාහරණ නොමැත."}</div>
                </div>
            `;
        }

        document.getElementById("translate").onclick = async () => {
            const inputField = document.getElementById("input");
            const outputDiv = document.getElementById("output");
            const translateBtn = document.getElementById("translate");
            const text = inputField.value.trim();

            if (!text) {
                outputDiv.innerHTML = `<div class="error-box" style="padding: 10px;">කරුණාකර යම් වාක්‍යයක් හෝ ප්‍රශ්නයක් ඇතුළත් කරන්න.</div>`;
                return;
            }

            if (countdownTimer) clearInterval(countdownTimer);

            const cacheKey = `trans_cache_${text.toLowerCase()}`;
            const cachedResult = localStorage.getItem(cacheKey);

            if (cachedResult) {
                parseAndDisplayResponse(cachedResult);
                outputDiv.innerHTML += `<div style='font-size: 11px; color: var(--text-secondary); text-align: center; margin-top: 8px;'>(⚡ මතකයෙන් ක්ෂණිකව ලබාගත් ප්‍රතිඵලයකි)</div>`;
                return;
            }

            translateBtn.disabled = true;
            translateBtn.style.opacity = "0.8";
            translateBtn.style.cursor = "not-allowed";
            translateBtn.innerHTML = "↻ Please wait...";

            outputDiv.innerHTML = "<div class='spinner-container'><div style='font-size: 14.5px; color: var(--accent-color);'>ගුරුවරයා පිළිතුර සකස් කරමින් පවතී...</div><div class='spinner'></div></div>";

            try {
                const result = await askGemini(text);

                if (result.text) {
                    localStorage.setItem(cacheKey, result.text);
                    parseAndDisplayResponse(result.text);
                } else {
                    startCountdown(60, result.error);
                }
            } catch (error) {
                startCountdown(60, `Execution Exception: ${error.message}`);
            } finally {
                translateBtn.disabled = false;
                translateBtn.style.opacity = "1";
                translateBtn.style.cursor = "pointer";
                translateBtn.innerHTML = "✨ Translate Now (පරිවර්තනය)";
            }
        };
