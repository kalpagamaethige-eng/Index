<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kalpa AI English Translator & Teacher</title>
    <!-- PWA සඳහා අවශ්‍ය Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f172a">
    
    <style>
        :root {
            --bg-primary: #0f172a;
            --bg-card: #1e293b;
            --border-color: #334155;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            padding: 12px;
            background: var(--bg-primary);
            color: var(--text-primary);
            max-width: 600px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
        }

        .header-box {
            text-align: center;
            margin-bottom: 15px;
            background: linear-gradient(135deg, #1e293b, #0f172a);
            padding: 15px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.3);
        }

        h1 {
            color: var(--accent-color);
            margin: 0 0 5px 0;
            font-size: 20px;
        }

        .creator-tag {
            color: var(--accent-hover);
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 3px;
            display: block;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 11px;
            margin: 0;
        }

        .container {
            background: var(--bg-card);
            padding: 16px;
            border-radius: 14px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            height: 110px;
            background: var(--bg-primary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px;
            font-size: 14px;
            resize: none;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--accent-color);
            box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.15);
        }

        button {
            background: linear-gradient(135deg, #0ea5e9, #0284c7);
            color: white;
            border: none;
            padding: 12px;
            margin-top: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 14px;
            transition: all 0.2s;
        }

        button:active {
            transform: scale(0.98);
        }

        #output {
            margin-top: 15px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            padding: 14px;
            border-radius: 10px;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 13px;
            color: #e2e8f0;
            flex: 1;
            overflow-y: auto;
            max-height: 40vh;
        }

        .loading {
            color: var(--accent-color);
            font-style: italic;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header-box">
        <span class="creator-tag">Created by Kalpa Gamaethige</span>
        <h1>KALPA AI English Translator & Teacher</h1>
        <p class="subtitle">ද්විභාෂා පරිවර්තනය, ව්‍යාකරණ නිවැරදි කිරීම සහ ඉගෙනුම් සහකරු</p>
    </div>

    <div class="container">
        <textarea id="input" placeholder="මෙතැනට ඔබේ වාක්‍යය හෝ ප්‍රශ්නය ලියන්න (උදා: I goes to school yesterday)..."></textarea>
        <button id="translate">Translate & Learn (පරිවර්තනය කර ඉගෙන ගන්න)</button>
        <div id="output">පිළිතුර මෙහි දිස් වනු ඇත...</div>
    </div>

    <script>
        const API_KEY = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;



        const systemPrompt = `You are an expert bilingual English-Sinhala AI teacher and translator.
Your responsibilities:
1. Translate English ↔ Sinhala accurately.
2. Correct grammar mistakes and awkward phrasing in the user's input.
3. Explain grammar in simple Sinhala.
4. Give beginner and advanced examples based on the structure.
5. Explain difficult vocabulary clearly.
6. Teach pronunciation guidance (using simple Sinhala phonetic representation).
7. Encourage conversation practice and maintain a friendly, professional, and supportive language teacher tone.
8. Always ask a relevant follow-up question in both English and Sinhala to keep the learning practice going.

Format your responses neatly with clear headings:
- **පරිවර්තනය (Translation)**:
- **නිවැරදි කළ වාක්‍යය (Corrected Sentence)**:
- **ව්‍යාකරණ පැහැදිලි කිරීම (Grammar Explanation)**:
- **උදාහරණ (Examples - Beginner & Advanced)**:
- **උච්චාරණය හා වචන මාලාව (Pronunciation & Vocabulary)**:
- **අභ්‍යාස ප්‍රශ්නය (Practice Question)**:`;

        async function askGemini(prompt) {
            const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`;
            
            for (let attempt = 0; attempt < 5; attempt++) {
                try {
                    const response = await fetch(url, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            contents: [{ parts: [{ text: prompt }] }],
                            systemInstruction: { parts: [{ text: systemPrompt }] }
                        })
                    });

                    if (!response.ok) throw new Error('Network response error');

                    const data = await response.json();
                    return data.candidates?.[0]?.content?.parts?.[0]?.text || "සමාවන්න, පිළිතුරක් ලැබුණේ නැත.";
                } catch (err) {
                    if (attempt === 4) throw err;
                    const delay = Math.pow(2, attempt) * 1000;
                    await new Promise(res => setTimeout(res, delay));
                }
            }
        }

        document.getElementById("translate").onclick = async () => {
            let text = document.getElementById("input").value.trim();
            if (!text) return;
            
            let outputDiv = document.getElementById("output");
            outputDiv.innerHTML = "<div class='loading'>ගුරුවරයා පිළිතුරු සකස් කරමින් පවතී...</div>";
            
            try {
                let result = await askGemini(text);
                outputDiv.innerHTML = result;
            } catch (error) {
                outputDiv.innerHTML = "සමාවන්න, තාක්ෂණික දෝෂයක් ඇති විය. කරුණාකර නැවත උත්සාහ කරන්න.";
            }
        };
    </script>
</body>
</html>
