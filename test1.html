        const GEMINI_MODELS = [

        const DEFAULT_SYSTEM_PROMPT = `You are an expert bilingual English-Sinhala AI teacher and translator.
Your responsibilities:
1. Translate English ↔ Sinhala accurately.
2. Correct grammar mistakes and awkward phrasing in the user's input. Highlight and explain grammar mistakes.
3. STRICT PASSIVE VOICE RULE: When converting or generating Passive Voice, strictly ensure the grammatical Object of the active sentence becomes the new Subject, with correct form of 'to be' + V3, and the original subject appropriately introduced using 'by' if needed, maintaining absolute structural accuracy.
4. ALWAYS identify and specify the Grammatical Tense & Time Category in both English and Sinhala.
5. Provide a clear Main Translation highlighted in both English and Sinhala format: [EN_TEXT] || [SI_TEXT].
6. Break down sentence structure clearly (Identify: 1. Subject / උක්තය, 2. Verb / ක්‍රියාපදය, 3. Object / කර්මය, 4. Modifiers/Other / වෙනත් කොටස්).
7. ALWAYS end your explanation with 1 engaging practice question in Sinhala under the heading "### 💬 අභ්‍යාස ප්‍රශ්නය (Practice Question)".
Format your responses neatly with clear headings:
🇱🇰 ප්‍රධාන පරිවර්තනය (Main Translation)
[EN_TEXT] || [SI_TEXT]
⌛ කාලය සහ ව්‍යාකරණ (Tense & Grammar)
English Tense: [Specific Tense Name]
Sinhala Tense: [සිංහල කාලය]
Verb Classification: [V1/V2/V3 status if applicable]
✍️ නිවැරදි කළ වාක්‍යය (Corrected Sentence)

1. උක්ත පදය (Subject): ...

        const isKeyBlocked = (index) => {
            try {
                const blockedTime = localStorage.getItem(`blocked_key_${index}`);
                if (!blockedTime) return false;
                const now = new Date().getTime();
                if (now - parseInt(blockedTime, 10) > 86400000) {
                    localStorage.removeItem(`blocked_key_${index}`);
                    return false;
                }
                return true;
            } catch (e) {
                return false;
            }
        };

        const blockKey = (index) => {
            try {
                const now = new Date().getTime();
                localStorage.setItem(`blocked_key_${index}`, now.toString());
            } catch (e) {}
        };

        const getActiveApiKey = (index) => {
            try {
                const encodedKey = ENCODED_KEYS[index];
                if (!encodedKey || encodedKey.includes("YOUR_")) return "";
                return atob(encodedKey.trim());
            } catch (e) {
                return "";
            }
        };

        const askGeminiService = async (promptText, customSystemPrompt = null) => {
            let collectedErrors = [];
            const activeSystemPrompt = customSystemPrompt || DEFAULT_SYSTEM_PROMPT;

            for (let m = 0; m < GEMINI_MODELS.length; m++) {
                const currentModel = GEMINI_MODELS[m];

                for (let i = 0; i < ENCODED_KEYS.length; i++) {
                    if (isKeyBlocked(i)) continue;

                    const currentApiKey = getActiveApiKey(i);
                    if (!currentApiKey) {
                        blockKey(i);
                        continue;
                    }

                    const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${currentApiKey}`;
                    const payload = {
                        contents: [{ role: "user", parts: [{ text: promptText }] }],
                        systemInstruction: { parts: [{ text: activeSystemPrompt }] }
                    };

                    try {
                        const response = await fetch(url, {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify(payload)
                        });

                        const data = await response.json();

                        if (response.status === 429 || response.status === 403) {
                            const rateMsg = data.error?.message || "Rate limit or quota exceeded";
                            collectedErrors.push(`[${currentModel}] Key #${i + 1} (Status ${response.status}): ${rateMsg}`);
                            blockKey(i);
                            continue;
                        }

                        if (!response.ok) {
                            const errDetails = data.error?.message || 'Request failed';
                            collectedErrors.push(`[${currentModel}] Key #${i + 1} (Status ${response.status}): ${errDetails}`);
                            blockKey(i);
                            continue;
                        }

                        const textOut = data.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (textOut) {
                            return { text: textOut, modelUsed: currentModel, keyIndex: i + 1, error: null };
                        } else {
                            collectedErrors.push(`[${currentModel}] Key #${i + 1}: Empty response payload.`);
                            blockKey(i);
                        }
                    } catch (error) {
                        collectedErrors.push(`[${currentModel}] Key #${i + 1}: Network/Runtime Error (${error.message})`);
                        blockKey(i);
                    }
                }
            }

            try {
                const envApiKey = "";
                const fallbackModel = "gemini-3-flash-preview";
                const url = `https://generativelanguage.googleapis.com/v1beta/models/${fallbackModel}:generateContent?key=${envApiKey}`;
                const payload = {
                    contents: [{ role: "user", parts: [{ text: promptText }] }],
                    systemInstruction: { parts: [{ text: activeSystemPrompt }] }
                };
                const response = await fetch(url, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                const textOut = data.candidates?.[0]?.content?.parts?.[0]?.text;
                if (textOut) {
                    return { text: textOut, modelUsed: fallbackModel + " (Runtime)", keyIndex: 0, error: null };
                }
            } catch (fallbackErr) {
                collectedErrors.push(`Runtime Env Fallback Error: ${fallbackErr.message}`);
            }

            return { text: null, error: collectedErrors.join('\n') || "සියලුම API Keys සහ Gemini මාදිලි මේ මොහොතේ සීමාවී ඇත. කරුණාකර සුළු මොහොතකින් නැවත උත්සාහ කරන්න." };
        };

        const speakBilingual = (enText, siText) => {
            const clean = (str) => str ? str.replace(/[\u{1F600}-\u{1F64F}\u{1F300}-\u{1F5FF}\u{1F680}-\u{1F6FF}\u{1F700}-\u{1F77F}\u{1F800}-\u{1F8FF}\u{1F900}-\u{1F9FF}\u{1FA00}-\u{1FA6F}\u{1FA70}-\u{1FAFF}\u{2600}-\u{26FF}\u{2700}-\u{27BF}🇬🇧🇱🇰]/gu, '').replace(/[*_#`~|[\](){}]/g, ' ').replace(/[.\-–—:=+?/<>]/g, ' ').trim() : "";
            
            const cleanEn = clean(enText);
            const cleanSi = clean(siText);

            if (cleanEn) {
                const enAudio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanEn)}&tl=en&client=tw-ob`);
                enAudio.play().catch(() => {
                    if ('speechSynthesis' in window) {
                        const u = new SpeechSynthesisUtterance(cleanEn);
                        u.lang = 'en-US';
                        window.speechSynthesis.speak(u);
                    }
                });

                if (cleanSi) {
                    enAudio.onended = () => {
                        const siAudio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanSi)}&tl=si&client=tw-ob`);
                        siAudio.play().catch(() => {
                            if ('speechSynthesis' in window) {
                                const uSi = new SpeechSynthesisUtterance(cleanSi);
                                uSi.lang = 'si-LK';
                                window.speechSynthesis.speak(uSi);
                            }
                        });
                    };
                } else {
                    if ('speechSynthesis' in window) {
                        const uSi = new SpeechSynthesisUtterance(cleanSi);
                        uSi.lang = 'si-LK';
                        window.speechSynthesis.speak(uSi);
                    }
                }
            } else if (cleanSi) {
                const siAudio = new Audio(`https://translate.google.com/translate_tts?ie=UTF-8&q=${encodeURIComponent(cleanSi)}&tl=si&client=tw-ob`);
                siAudio.play().catch(() => {
                    if ('speechSynthesis' in window) {
                        const uSi = new SpeechSynthesisUtterance(cleanSi);
                        uSi.lang = 'si-LK';
                        window.speechSynthesis.speak(uSi);
                    }
                });
            }
        };

        const saveToHistory = (input, output) => {
            try {
                const existing = JSON.parse(localStorage.getItem('app_translation_history') || '[]');
                const newItem = { id: Date.now(), input, output, time: new Date().toLocaleTimeString() };
                const updated = [newItem, ...existing.filter(item => item.input !== input)].slice(0, 20);
                localStorage.setItem('app_translation_history', JSON.stringify(updated));
            } catch (e) {
                console.error(e);
            }
        };

        const saveToFavorites = (input, output) => {
            try {
                const existing = JSON.parse(localStorage.getItem('app_translation_favorites') || '[]');
                if (existing.some(item => item.input === input)) return false;
                const newItem = { id: Date.now(), input, output };
                localStorage.setItem('app_translation_favorites', JSON.stringify([newItem, ...existing]));
                return true;
            } catch (e) {
                console.error(e);
                return false;
            }
        };

        const ScreenBox = ({ title, icon, children, badge, color = "sky", className = "" }) => {
            const colorMap = {
                sky: "border-sky-300 dark:border-sky-500/30 bg-sky-100 dark:bg-sky-500/5 text-sky-600 dark:text-sky-400",
                emerald: "border-emerald-300 dark:border-emerald-500/30 bg-emerald-100 dark:bg-emerald-500/5 text-emerald-600 dark:text-emerald-400",
                amber: "border-amber-300 dark:border-amber-500/30 bg-amber-100 dark:bg-amber-500/5 text-amber-600 dark:text-amber-400",
                purple: "border-purple-300 dark:border-purple-500/30 bg-purple-100 dark:bg-purple-500/5 text-purple-600 dark:text-purple-400",
                blue: "border-blue-300 dark:border-blue-500/30 bg-blue-100 dark:bg-blue-500/5 text-blue-600 dark:text-blue-400",
            };

                <div className={`rounded-2xl border border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900/90 p-3.5 sm:p-4 backdrop-blur-sm shadow-xl transition-all duration-200 ${className}`}>
                    {title && (

                                {icon && (
                                    <div className={`p-1.5 rounded-lg border ${colorMap[color] || colorMap.sky}`}>
                                        <Icon name={icon} size={16} />
                                    </div>
                                )}
                                <h3 className="font-semibold text-slate-900 dark:text-slate-100 text-xs sm:text-sm tracking-wide">{title}</h3>
                            </div>
                            {badge && (
                                <span className="text-[11px] font-medium px-2 py-0.5 rounded-full bg-slate-100 dark:bg-slate-800 text-sky-600 dark:text-sky-300 border border-slate-300 dark:border-slate-700">
                                    {badge}
                                </span>
                            )}
                        </div>
                    )}
                    <div className="text-slate-700 dark:text-slate-200">{children}</div>
                </div>
            );
        };

        const FormattedMarkdownOutput = ({ text }) => {
            if (!text) return null;
            const lines = text.split('\n');
            const elements = [];

            lines.forEach((line, idx) => {
                const trimmed = line.trim();
                if (!trimmed) return;

                if (/^[-*_]{3,}$/.test(trimmed)) {
                    elements.push(<div key={idx} className="my-4 h-px bg-slate-200 dark:bg-slate-800/80" />);
                    return;
                }

                if (trimmed.includes('||')) {
                    const parts = trimmed.split('||');
                    const cleanEn = parts[0].replace(/^[\s\[\(\{\*\_]+|[\]\)\}\*\_\s]+$/g, '').replace(/\[EN_TEXT\]|EN_TEXT/g, '').trim();
                    const cleanSi = parts[1].replace(/^[\s\[\(\{\*\_]+|[\]\)\}\*\_\s]+$/g, '').replace(/\[SI_TEXT\]|SI_TEXT/g, '').trim();
                    elements.push(
                        <div key={idx} className="my-4 p-4 rounded-2xl border border-sky-300 dark:border-sky-500/30 bg-sky-50 dark:bg-[#0B1528] shadow-lg flex items-center justify-between gap-3">
                            <div className="space-y-2 flex-1">
                                <div className="text-base sm:text-lg font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2">
                                    <span className="text-lg">🇬🇧</span>
                                    <span>{cleanEn}</span>
                                </div>
                                <div className="text-sm sm:text-base font-semibold text-amber-600 dark:text-amber-300 flex items-center gap-2">
                                    <span className="text-lg">🇱🇰</span>
                                    <span>{cleanSi}</span>
                                </div>
                            </div>
                            <button
                                onClick={() => speakBilingual(cleanEn, cleanSi)}
                                title="ශ්‍රවණය කරන්න"
                                className="w-10 h-10 rounded-md bg-sky-500 hover:bg-sky-400 text-white flex items-center justify-center shrink-0 shadow-lg shadow-sky-500/30 transition-transform active:scale-95 touch-manipulation"
                            >
                                <Icon name="volume-2" size={20} />
                            </button>
                        </div>
                    );
                    return;
                }

                const isHeaderLine = trimmed.startsWith('#') ||
                    /^(🇱🇰|⌛|⏳|✍️|🧩|📖|💡|💬|📌)/.test(trimmed) ||
                    trimmed.includes('ප්‍රධාන පරිවර්තනය') ||
                    trimmed.includes('කාලය සහ ව්‍යාකරණ') ||
                    trimmed.includes('නිවැරදි කළ වාක්‍යය') ||

            const startCountdownTimer = (seconds, rawError) => {

                timerRef.current = setInterval(() => {
                    setCountdown((prev) => {

            const handleTranslate = async (customPrompt = null) => {
                const textToProcess = customPrompt || inputText.trim();
                if (!textToProcess) {
                    setOutputText("කරුණාකර යම් වාක්‍යක් හෝ ප්‍රශ්නයක් ඇතුළත් කරන්න.");

                if (timerRef.current) clearInterval(timerRef.current);
                setErrorDetails(null);
                setCountdown(0);

                const cacheKey = `trans_cache_${textToProcess.toLowerCase()}`;
                const cachedResult = localStorage.getItem(cacheKey);

            const handlePaste = async () => {

        const parseRobustJson = (rawText) => {
            if (!rawText) return null;
            try {
                let clean = rawText.replace(/```json/gi, '').replace(/```/g, '').replace(/[\u2060]/g, '').trim();
                let firstBrace = clean.indexOf('{');
                let lastBrace = clean.lastIndexOf('}');
                if (firstBrace !== -1 && lastBrace !== -1) {
                    clean = clean.substring(firstBrace, lastBrace + 1);
                }
                return JSON.parse(clean);
            } catch (err) {
                console.error("JSON Parse Error:", err, rawText);
                return null;
            }

        const ChartsScreen = () => {

                    handleAnalyzePhrase(defaultExample);
                }
            }, []);

            const handleAnalyzePhrase = async (phraseInput = null) => {

                setLoading(true);

                                <button
                                    onClick={handleUnlock}
                                    className="bg-sky-600 hover:bg-sky-500 text-white font-bold px-4 py-2 rounded-xl text-xs transition shadow-md"
                                >
                                    Unlock
                                </button>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="space-y-3 max-w-xl mx-auto">
                    <ScreenBox title="System Architecture & API Config (Unlocked)" icon="settings" color="sky">
                        <div className="space-y-2.5 text-xs text-slate-700 dark:text-slate-300">
                            <div>
                                <label className="text-slate-500 dark:text-slate-400 block mb-1">Active Application Version</label>
                                <p className="font-mono text-emerald-600 dark:text-emerald-400 bg-slate-50 dark:bg-slate-950 p-2 rounded border border-slate-300 dark:border-slate-800 transition-colors">
                                    V 3.0 Multi-Tier Smart Fallback Pro (Verified Creator Access)
                                </p>
                            </div>
                            <div>
                                <label className="text-slate-500 dark:text-slate-400 block mb-1">Model Fallback Chain</label>
                                <p className="font-mono text-amber-600 dark:text-amber-300 bg-slate-50 dark:bg-slate-950 p-2 rounded border border-slate-300 dark:border-slate-800 transition-colors">
                                    gemini-3.7-flash ➔ gemini-3.6-flash ➔ gemini-3-flash-preview ➔ gemini-2.5-flash ➔ gemini-1.5-flash
                                </p>
                            </div>
                            <div>
                                <label className="text-slate-500 dark:text-slate-400 block mb-1">Encoded API Key Pool</label>
                                <p className="font-mono text-sky-600 dark:text-sky-400 bg-slate-50 dark:bg-slate-950 p-2 rounded border border-slate-300 dark:border-slate-800 transition-colors">
                                    30 Keys loaded in Auto Rotation Pool.
                                </p>
                            </div>
                        </div>
                    </ScreenBox>
                </div>
            );
        };

        function App() {
            const [activeTab, setActiveTab] = useState('home');
            const [darkMode, setDarkMode] = useState(() => {
                const savedTheme = localStorage.getItem('app_theme');
                if (savedTheme) return savedTheme === 'dark';
                return true; 
            });

            useEffect(() => {
                if (darkMode) {
                    document.documentElement.classList.add('dark');
                    localStorage.setItem('app_theme', 'dark');
                } else {
                    document.documentElement.classList.remove('dark');
                    localStorage.setItem('app_theme', 'light');
                }
            }, [darkMode]);

            const tabs = [
                { id: 'home', label: 'Home', icon: 'home' },
                { id: 'translator', label: '1. Translator', icon: 'languages' },
                { id: 'charts', label: '2. Charts & Notes', icon: 'bar-chart-3' },
                { id: 'verbs', label: '3. Verb Lists', icon: 'book-open' },
                { id: 'practice', label: '4. Practice Quiz', icon: 'brain-circuit' },
                { id: 'word-of-the-day', label: 'Word of the Day', icon: 'star' },
                { id: 'config', label: 'System Config', icon: 'settings' },
            ];

            return (
                <div className="min-h-screen font-sans p-2 sm:p-4 selection:bg-sky-500 selection:text-white overscroll-none transition-colors duration-300">
                    <div className="max-w-xl mx-auto w-full text-center mb-3 bg-gradient-to-b from-white to-slate-50 dark:from-slate-900 dark:to-slate-950 p-3.5 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl space-y-1 transition-colors duration-300">
                        <span className="text-[10px] sm:text-xs font-bold text-sky-600 dark:text-sky-400 tracking-wider uppercase block">
                            Created by Kalpa Gamaethige
                        </span>
                        <div className="flex items-center justify-center gap-2">
                            <h1 className="text-lg sm:text-2xl font-extrabold text-sky-600 dark:text-sky-400">
                                AI English Translator & Teacher
                            </h1>
                        </div>
                        <p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 pt-0.5">
                            ද්විභාෂා පරිවර්තනය, ව්‍යාකරණ නිවැරදි කිරීම සහ ඉගෙනුම් සහකරු
                        </p>
                    </div>

                    <div className="max-w-xl mx-auto w-full mb-3">
                        <div className="flex bg-slate-200 dark:bg-slate-900/90 p-1 rounded-xl border border-slate-300 dark:border-slate-800 overflow-x-auto gap-1 no-scrollbar transition-colors duration-300">
                            {tabs.map((t) => {
                                const active = activeTab === t.id;
                                return (
                                    <button
                                        key={t.id}
                                        onClick={() => setActiveTab(t.id)}
                                        className={`flex items-center gap-1.5 px-2.5 py-2 rounded-lg text-[11px] sm:text-xs font-semibold whitespace-nowrap transition-all flex-1 justify-center touch-manipulation select-none ${active ? 'bg-gradient-to-r from-sky-500 to-blue-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-800/50'}`}
                                    >
                                        <Icon name={t.icon} size={14} />
                                        <span>{t.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <div className="max-w-xl mx-auto w-full flex-1">
                        {activeTab === 'home' && <HomeScreen onNavigate={(tab) => setActiveTab(tab)} />}
                        {activeTab === 'translator' && <TranslatorScreen darkMode={darkMode} setDarkMode={setDarkMode} />}
                        {activeTab === 'charts' && <ChartsScreen />}
                        {activeTab === 'verbs' && <VerbListsScreen />}
                        {activeTab === 'practice' && <PracticeQuizScreen />}
                        {activeTab === 'word-of-the-day' && <WordOfTheDayScreen />}
                        {activeTab === 'config' && <SystemConfigScreen />}
                    </div>

                    <footer className="max-w-xl mx-auto w-full text-center py-3 mt-4 border-t border-slate-300 dark:border-slate-800/60 text-[11px] sm:text-xs text-slate-500 dark:text-slate-500 transition-colors duration-300">
                        © 2026 AI English Translator & Teacher V 3.0 Pro | Developed with React.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
