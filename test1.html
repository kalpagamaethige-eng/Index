        const isKeyBlocked = (index) => {
            try {
                const blockedTime = localStorage.getItem(`blocked_key_${index}`);
                if (!blockedTime) return false;
                const now = new Date().getTime();
                // 2-minute temporary cooldown (120000ms) to ensure continuous API key cycling
                if (now - parseInt(blockedTime, 10) > 120000) {
                    localStorage.removeItem(`blocked_key_${index}`);
                    return false;
                }
                return true;
            } catch (e) {
                return false;
            }
        };

        const blockKey = (index) => {
            try {
                const now = new Date().getTime();
                localStorage.setItem(`blocked_key_${index}`, now.toString());
            } catch (e) {}
        };

        const clearAllBlockedKeys = () => {
            try {
                for (let i = 0; i < ENCODED_KEYS.length; i++) {
                    localStorage.removeItem(`blocked_key_${i}`);
                }
            } catch (e) {}
        };

        const getActiveApiKey = (index) => {
            try {
                const encodedKey = ENCODED_KEYS[index];
                if (!encodedKey || encodedKey.includes("YOUR_")) return "";
                return atob(encodedKey.trim());
            } catch (e) {
                return "";
            }
        };

        const askGeminiService = async (promptText, customSystemPrompt = null) => {
            let collectedErrors = [];
            const activeSystemPrompt = customSystemPrompt || DEFAULT_SYSTEM_PROMPT;

            for (let pass = 0; pass < 2; pass++) {
                if (pass === 1) {
                    clearAllBlockedKeys();
                }

                for (let m = 0; m < GEMINI_MODELS.length; m++) {
                    const currentModel = GEMINI_MODELS[m];

                    for (let i = 0; i < ENCODED_KEYS.length; i++) {
                        if (pass === 0 && isKeyBlocked(i)) continue;

                        const currentApiKey = getActiveApiKey(i);
                        if (!currentApiKey) {
                            blockKey(i);
                            continue;
                        }

                        const url = `https://generativelanguage.googleapis.com/v1beta/models/${currentModel}:generateContent?key=${currentApiKey}`;
                        const payload = {
                            contents: [{ role: "user", parts: [{ text: promptText }] }],
                            systemInstruction: { parts: [{ text: activeSystemPrompt }] }
                        };

                        try {
                            const response = await fetch(url, {
                                method: "POST",
                                headers: { "Content-Type": "application/json" },
                                body: JSON.stringify(payload)
                            });

                            const data = await response.json();

                            if (response.status === 404) {
                                collectedErrors.push(`[${currentModel}] Model Not Found (404)`);
                                break;
                            }

                            if (response.status === 429 || response.status === 403) {
                                const rateMsg = data.error?.message || "Rate limit or quota exceeded";
                                collectedErrors.push(`[${currentModel}] Key #${i + 1} (${response.status}): ${rateMsg}`);
                                blockKey(i);
                                continue;
                            }

                            if (!response.ok) {
                                const errDetails = data.error?.message || 'Request failed';
                                collectedErrors.push(`[${currentModel}] Key #${i + 1} (${response.status}): ${errDetails}`);
                                blockKey(i);
                                continue;
                            }

                            const textOut = data.candidates?.[0]?.content?.parts?.[0]?.text;
                            if (textOut) {
                                return { text: textOut, modelUsed: currentModel, keyIndex: i + 1, error: null };
                            } else {
                                collectedErrors.push(`[${currentModel}] Key #${i + 1}: Empty response payload.`);
                                blockKey(i);
                            }
                        } catch (error) {
                            collectedErrors.push(`[${currentModel}] Key #${i + 1}: Network Error (${error.message})`);
                            blockKey(i);
                        }
                    }
                }
            }

            return { text: null, error: collectedErrors.join('\n') || "සියලුම API Keys සහ Gemini මාදිලි මේ මොහොතේ සීමාවී ඇත. කරුණාකර සුළු මොහොතකින් නැවත උත්සාහ කරන්න." };

                { label: "If I knew the answer, I would tell you.", text: "If I knew the answer, I would tell you." }
            ];

            const startCountdownTimer = (seconds, rawError) => {
                setErrorDetails(rawError);
                setCountdown(seconds);
                if (timerRef.current) clearInterval(timerRef.current);
                timerRef.current = setInterval(() => {
                    setCountdown((prev) => {
                        if (prev <= 1) {
                            clearInterval(timerRef.current);
                            return 0;
                        }
                        return prev - 1;
                    });
                }, 1000);
            };

            const handleTranslate = async (customPrompt = null) => {
                const textToProcess = customPrompt || inputText.trim();
                if (!textToProcess) {
                    setOutputText("කරුණාකර යම් වාක්‍යක් හෝ ප්‍රශ්නයක් ඇතුළත් කරන්න.");
                    return;
                }
                localStorage.setItem('app_last_translated_phrase', textToProcess);
                if (timerRef.current) clearInterval(timerRef.current);
                setErrorDetails(null);
                setCountdown(0);
                setIsCached(false);

                const cacheKey = `trans_cache_${textToProcess.toLowerCase()}`;
                const cachedResult = localStorage.getItem(cacheKey);
                if (cachedResult && !customPrompt) {
                    setOutputText(cachedResult);
                    setIsCached(true);
                    return;
                }

                setLoading(true);
                setOutputText('');
                try {
                    const result = await askGeminiService(textToProcess);
                    if (result.text) {
                        if (!customPrompt) {
                            localStorage.setItem(cacheKey, result.text);
                            saveToHistory(textToProcess, result.text);
                        }
                        setOutputText(result.text);
                    } else {
                        startCountdownTimer(30, result.error);

                    setLoading(false);

                    return;
                }
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

                let lastBrace = clean.lastIndexOf('}');
                if (firstBrace !== -1 && lastBrace !== -1) {
                    clean = clean.substring(firstBrace, lastBrace + 1);

                return JSON.parse(clean);

nglish": "N/A", "sinhala": "N/A" }, { "tense": "5. Past Simple (සාමාන්‍ය අතීත කාලය)", "english": "...", "sinhala": "..." }, { "tense": "6. Past Continuous (අතීත නොනැවතුනු කාලය)", "english": "...", "sinhala": "..." }, { "tense": "7. Past Perfect (අතීත පූර්ණ කාලය)", "english": "...", "sinhala": "..." }, { "tense": "8. Past Perfect Continuous (අතීත පූර්ණ නොනැවතුනු කාලය)", "english": "N/A", "sinhala": "N/A" }, { "tense": "9. Future Simple (සාමාන්‍ය අනාගත කාලය)", "english": "...", "sinhala": "..." }, { "tense": "10. Future Continuous (අනාගත නොනැවතුනු කාලය)", "english": "N/A", "sinhala": "N/A" }, { "tense": "11. Future Perfect (අනාගත පූර්ණ කාලය)", "english": "...", "sinhala": "..." }, { "tense": "12. Future Perfect Continuous (අනාගත පූර්ණ නොනැවතුනු කාලය)", "english": "N/A", "sinhala": "N/A" } ], "modalVerbs": [ { "modal": "1. Can (පුළුවන්)", "english": "...", "sinhala": "..." }, { "modal": "2. Could (පුළුවන්කම තිබුණා/වේවි)", "english": "...", "sinhala": "..." }, { "modal": "3. Should (යුතුයි)", "english": "...", "sinhala": "..." }, { "modal": "4. Must (අනිවාර්යයෙන්ම කළ යුතුයි)", "english": "...", "sinhala": "..." }, { "modal": "5. May / Might (සමහරවිට ඉඩ තිබේ)", "english": "...", "sinhala": "..." }, { "modal": "6. Would (කරනු ඇත)", "english": "...", "sinhala": "..." } ], "otherPatterns": [ { "pattern": "1. ප්‍රශ්නාර්ථ වාක්‍යය (Question Form)", "english": "...", "sinhala": "..." }, { "pattern": "2. නැත අර්ථ වාක්‍යය (Negative Form)", "english": "...", "sinhala": "..." }, { "pattern": "3. කොන්දේසි සහිත වාක්‍යය (Conditional / If clause)", "english": "...", "sinhala": "..." }, { "pattern": "4. ආයාචනා / නියෝග වාක්‍යය (Imperative / Request)", "english": "...", "sinhala": "..." } ] }`;

                setLoading(true);
                setSelected(null);
                const prompt = 'Generate 1 multiple choice grammar question for Sinhala speakers learning English. JSON Output Format ONLY: { "question": "Sentence with blank __", "options": ["A", "B", "C", "D"], "correctIndex": 0, "explanation": "Explanation in Sinhala including tense details" }';
                try {
                    const res = await askGeminiService(prompt, "Output strictly raw JSON without markdown codeblocks.");
                    if (res.text) {
                        const parsed = parseRobustJson(res.text);
                        if (parsed) setQuiz(parsed);
                    }
                } catch (e) {
                    console.error(e);
                } finally {
                    setLoading(false);
                }
            };

                loadQuestion();
            }, []);

                <div className="min-h-screen font-sans p-2 sm:p-4 selection:bg-sky-500 selection:text-white overscroll-none transition-colors duration-300">
                    <div className="max-w-xl mx-auto w-full text-center mb-3 bg-gradient-to-b from-white to-slate-50 dark:from-slate-900 dark:to-slate-950 p-3.5 sm:p-4 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl space-y-1 transition-colors duration-300">
                        <span className="text-[10px] sm:text-xs font-bold text-sky-600 dark:text-sky-400 tracking-wider uppercase block">
                            Created by Kalpa Gamaethige
                        </span>
                        <div className="flex items-center justify-center gap-2">
                            <h1 className="text-lg sm:text-2xl font-extrabold text-sky-600 dark:text-sky-400">
                                AI English Translator & Teacher
                            </h1>
                        </div>
                        <p className="text-[11px] sm:text-xs text-slate-500 dark:text-slate-400 pt-0.5">
                            ද්විභාෂා පරිවර්තනය, ව්‍යාකරණ නිවැරදි කිරීම සහ ඉගෙනුම් සහකරු
                        </p>
                    </div>

                    <div className="max-w-xl mx-auto w-full mb-3">
                        <div className="flex bg-slate-200 dark:bg-slate-900/90 p-1 rounded-xl border border-slate-300 dark:border-slate-800 overflow-x-auto gap-1 no-scrollbar transition-colors duration-300">
                            {tabs.map((t) => {
                                const active = activeTab === t.id;
                                return (
                                    <button
                                        key={t.id}
                                        onClick={() => setActiveTab(t.id)}
                                        className={`flex items-center gap-1.5 px-2.5 py-2 rounded-lg text-[11px] sm:text-xs font-semibold whitespace-nowrap transition-all flex-1 justify-center touch-manipulation select-none ${active ? 'bg-gradient-to-r from-sky-500 to-blue-600 text-white shadow-md' : 'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-200 hover:bg-slate-300 dark:hover:bg-slate-800/50'}`}
                                    >
                                        <Icon name={t.icon} size={14} />
                                        <span>{t.label}</span>
                                    </button>
                                );
                            })}
                        </div>
                    </div>

                    <div className="max-w-xl mx-auto w-full flex-1">
                        {activeTab === 'home' && <HomeScreen onNavigate={(tab) => setActiveTab(tab)} />}
                        {activeTab === 'translator' && <TranslatorScreen darkMode={darkMode} setDarkMode={setDarkMode} />}
                        {activeTab === 'charts' && <ChartsScreen />}
                        {activeTab === 'verbs' && <VerbListsScreen />}
                        {activeTab === 'practice' && <PracticeQuizScreen />}
                        {activeTab === 'word-of-the-day' && <WordOfTheDayScreen />}
                        {activeTab === 'config' && <SystemConfigScreen />}
                    </div>

                    <footer className="max-w-xl mx-auto w-full text-center py-3 mt-4 border-t border-slate-300 dark:border-slate-800/60 text-[11px] sm:text-xs text-slate-500 dark:text-slate-500 transition-colors duration-300">
                        © 2026 AI English Translator & Teacher V 3.0 Pro | Developed with React.
                    </footer>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
